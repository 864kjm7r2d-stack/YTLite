name: Create YouTube Plus - iPhone XS v4.1.1 Final Ultra

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Keep YouPiP / PiP for non-Premium"
        type: boolean
        required: true
        default: true

      enable_ytuhd:
        description: "Keep YTUHD / 4K support"
        type: boolean
        required: true
        default: true

      enable_ytpf:
        description: "YTPlaybackFix +0.25s (auto-retry Error 14)"
        type: boolean
        required: true
        default: true

      trim_localizations:
        description: "Clean Base: keep only Base/en/ko localizations (size trim)"
        type: boolean
        required: true
        default: true

      ipa_url:
        description: "URL to the decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      tweak_version:
        description: "YTLite version (XS Lite target: 5.2b4)"
        default: "5.2b4"
        required: true
        type: string

      display_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build XS v4.1.1 Final Ultra
    runs-on: macos-latest

    steps:
      - name: Install Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install make ldid dpkg

      - name: Set PATH environment variable
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5
        env:
          cache-name: theos_cache_9bc7340
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: ${{ steps.theos.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: ${{ steps.theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk "$THEOS/sdks"

      - name: Clone YouTube headers
        run: |
          if [ -d "$THEOS/include/YouTubeHeader" ]; then
            cd "$THEOS/include/YouTubeHeader" && git pull
          else
            cd "$THEOS/include" && git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git
          fi
          if [ -d "$THEOS/include/PSHeader" ]; then
            cd "$THEOS/include/PSHeader" && git pull
          else
            cd "$THEOS/include" && git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git
          fi

      - name: Clone YTLite source (pinned free release)
        run: |
          git clone --quiet --depth=1 --branch "v${{ inputs.tweak_version }}" \
            https://github.com/dayanch96/YTLite.git YTLiteSource

      - name: Patch YTLite hot paths for XS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          root = Path("YTLiteSource")

          mk = root / "Makefile"
          src = mk.read_text()
          old = "$(TWEAK_NAME)_CFLAGS = -fobjc-arc -DTWEAK_VERSION=$(PACKAGE_VERSION)"
          new = "$(TWEAK_NAME)_CFLAGS = -fobjc-arc -DTWEAK_VERSION=$(PACKAGE_VERSION) -Oz -flto -fvisibility=hidden -ffunction-sections -fdata-sections\n$(TWEAK_NAME)_LDFLAGS += -flto -Wl,-dead_strip"
          if old not in src:
              raise SystemExit("YTLite Makefile layout changed")
          mk.write_text(src.replace(old, new, 1))

          hdr = root / "YTLite.h"
          h = hdr.read_text()

          # v5.2b4 has these four macros on consecutive lines.
          # Match line-by-line instead of depending on blank-line spacing.
          macro_lines = [
              '#define ytlBool(key) [[YTLUserDefaults standardUserDefaults] boolForKey:key]',
              '#define ytlInt(key) [[YTLUserDefaults standardUserDefaults] integerForKey:key]',
              '#define ytlSetBool(value, key) [[YTLUserDefaults standardUserDefaults] setBool:(value) forKey:(key)]',
              '#define ytlSetInt(value, key) [[YTLUserDefaults standardUserDefaults] setInteger:(value) forKey:(key)]',
          ]
          old = '\n'.join(macro_lines)
          if old not in h:
              missing = [line for line in macro_lines if line not in h]
              raise SystemExit(f"YTLite.h defaults macros changed; missing={missing}")

          new = base64.b64decode(
              ''
          ).decode()
          hdr.write_text(h.replace(old, new, 1))

          y = root / "YTLite.x"
          x = y.read_text()
          start = x.index('%hook YTIElementRenderer\n- (NSData *)elementData {')
          end = x.index('%end', start) + len('%end')
          replacement = base64.b64decode('').decode()
          x = x[:start] + replacement + x[end:]

          old_line = '    if (ytlBool(@"shortsToRegular")) [self performSelector:@selector(shortsToRegular) withObject:nil afterDelay:0.75];\n'
          if old_line not in x:
              raise SystemExit("YTLite shorts delay hook changed")
          x = x.replace(old_line, '', 1)
          y.write_text(x)

          print("Applied YTLite XS hot-path patches")
          PY

      - name: Build optimized YTLite
        run: |
          cd YTLiteSource
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          deb=$(find packages -type f -name "*.deb" | head -1)
          test -n "$deb"
          cp "$deb" ../ytplus.deb

      - name: Clone YouPiP
        if: ${{ inputs.enable_youpip }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git

      - name: Clone YTUHD
        if: ${{ inputs.enable_ytuhd }}
        run: git clone --quiet --depth=1 https://github.com/Tonwalter888/YTUHD.git

      - name: Clone YouGroupSettings
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git

      - name: Clone YTVideoOverlay
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git

      - name: Clone YTPlaybackFix
        if: ${{ inputs.enable_ytpf }}
        run: git clone --quiet --depth=1 https://github.com/Mark02-2012/YTPlaybackFix.git

      - name: Apply dead-code flags to support tweaks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for folder, var in [
              ("YTUHD", "YTUHD"),
              ("YouPiP", "YouPiP"),
              ("YTVideoOverlay", "YTVideoOverlay"),
              ("YouGroupSettings", "YouGroupSettings"),
              ("YTPlaybackFix", "YTPlaybackFix"),
          ]:
              mk = Path(folder) / "Makefile"
              if not mk.exists():
                  continue
              txt = mk.read_text()
              txt += f"\n{var}_CFLAGS += -Oz -fvisibility=hidden -ffunction-sections -fdata-sections\n"
              txt += f"{var}_LDFLAGS += -Wl,-dead_strip\n"
              mk.write_text(txt)
          PY

      - name: Patch YTPlaybackFix resume offset (+0.25s)
        if: ${{ inputs.enable_ytpf }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("YTPlaybackFix/Refresh.xm")
          s = p.read_text()
          old = "[pvc seekToTime:savedTime]"
          new = "[pvc seekToTime:(savedTime + 0.25)]"
          count = s.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 seek restore calls, found {count}; upstream YTPlaybackFix changed")
          p.write_text(s.replace(old, new))
          print("Patched both resume seeks to savedTime + 0.25s")
          PY

      - name: Create XS Runtime Lite
        run: |
          mkdir -p XSRuntimeLite

          cat > XSRuntimeLite/Makefile <<'MAKEFILE'
          ARCHS = arm64
          TARGET = iphone:clang:16.5:15.0
          INSTALL_TARGET_PROCESSES = YouTube

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = XSRuntimeLite
          XSRuntimeLite_FILES = Tweak.xm
          XSRuntimeLite_CFLAGS = -fobjc-arc -Oz -flto -fvisibility=hidden -ffunction-sections -fdata-sections
          XSRuntimeLite_LDFLAGS = -flto -Wl,-dead_strip
          XSRuntimeLite_FRAMEWORKS = UIKit Foundation

          include $(THEOS_MAKE_PATH)/tweak.mk
          MAKEFILE

          cat > XSRuntimeLite/control <<'CONTROL'
          Package: com.local.xsruntimelite
          Name: XS Runtime Lite
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Merged low-overhead Mix filter and Shorts-to-Regular fix.
          Maintainer: Local Build
          Author: Local Build
          Section: Tweaks
          Depends: mobilesubstrate
          CONTROL

          cat > XSRuntimeLite/XSRuntimeLite.plist <<'PLIST'
          { Filter = { Executables = ( "YouTube" ); }; }
          PLIST

          cat > XSRuntimeLite/Tweak.xm <<'TWEAK'
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #import <objc/message.h>
          #import <objc/runtime.h>
          #import <string.h>

          @interface YTIElementRenderer : NSObject
          - (NSData *)elementData;
          @end

          @interface YTPlayerViewController : UIViewController
          @property (nonatomic, readonly) NSString *contentVideoID;
          @end

          @interface YTShortsPlayerViewController : UIViewController
          @property (nonatomic, strong) YTPlayerViewController *player;
          @end

          static id YTLDefaults(void) {
              static id defaults = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  Class cls = NSClassFromString(@"YTLUserDefaults");
                  SEL sel = NSSelectorFromString(@"standardUserDefaults");
                  if (cls && [cls respondsToSelector:sel]) {
                      defaults = ((id (*)(id, SEL))objc_msgSend)((id)cls, sel);
                  }
              });
              return defaults;
          }

          static BOOL YTLBool(NSString *key) {
              id defaults = YTLDefaults();
              if (!defaults) return NO;

              static SEL boolSel;
              static dispatch_once_t boolOnce;
              dispatch_once(&boolOnce, ^{ boolSel = sel_registerName("boolForKey:"); });
              if (![defaults respondsToSelector:boolSel]) return NO;

              return ((BOOL (*)(id, SEL, id))objc_msgSend)(defaults, boolSel, key);
          }

          static BOOL DataContainsASCII(NSData *data, const char *needle) {
              if (!data || data.length == 0 || !needle || !*needle) return NO;

              size_t needleLen = strlen(needle);
              if (needleLen == 0 || data.length < needleLen) return NO;

              const unsigned char *hay = (const unsigned char *)data.bytes;
              const unsigned char *n = (const unsigned char *)needle;
              NSUInteger hayLen = data.length;

              for (NSUInteger i = 0; i + needleLen <= hayLen; i++) {
                  if (hay[i] == n[0] && memcmp(hay + i, n, needleLen) == 0) {
                      return YES;
                  }
              }
              return NO;
          }

          static BOOL LooksLikeAutoMix(NSData *data) {
              // Fast-path only on concrete radio/mix markers.
              // No -description, lowercase conversion, or renderer object dump.
              if (DataContainsASCII(data, "start_radio=1") ||
                  DataContainsASCII(data, "mix-watch")) {
                  return YES;
              }

              return DataContainsASCII(data, "list=RD") ||
                     DataContainsASCII(data, "playlistId=RD") ||
                     DataContainsASCII(data, "playlist_id=RD");
          }

          %hook YTIElementRenderer

          - (NSData *)elementData {
              NSData *data = %orig;

              if (!YTLBool(@"hideMixPlaylists")) {
                  return data;
              }

              return LooksLikeAutoMix(data) ? nil : data;
          }

          %end

          static NSString *lastRedirectedVideoID = nil;
          static NSTimeInterval lastRedirectTime = 0;

          static void RedirectShortToRegular(YTShortsPlayerViewController *vc) {
              if (!YTLBool(@"shortsToRegular")) return;

              NSString *videoID = vc.player.contentVideoID;
              if (videoID.length == 0) return;

              NSTimeInterval now = CFAbsoluteTimeGetCurrent();
              if ([lastRedirectedVideoID isEqualToString:videoID] &&
                  (now - lastRedirectTime) < 2.0) {
                  return;
              }

              lastRedirectedVideoID = [videoID copy];
              lastRedirectTime = now;

              NSURL *url = [NSURL URLWithString:
                  [NSString stringWithFormat:@"vnd.youtube://%@", videoID]];
              if (!url) return;

              UIApplication *app = [UIApplication sharedApplication];
              if ([app canOpenURL:url]) {
                  [app openURL:url options:@{} completionHandler:nil];
              }
          }

          %hook YTShortsPlayerViewController

          - (void)viewDidAppear:(BOOL)animated {
              %orig;

              if (!YTLBool(@"shortsToRegular")) return;

              RedirectShortToRegular(self);

              if (self.player.contentVideoID.length == 0) {
                  __weak YTShortsPlayerViewController *weakSelf = self;
                  dispatch_after(
                      dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.08 * NSEC_PER_SEC)),
                      dispatch_get_main_queue(),
                      ^{
                          YTShortsPlayerViewController *strongSelf = weakSelf;
                          if (strongSelf) RedirectShortToRegular(strongSelf);
                      }
                  );
              }
          }

          %end
          TWEAK

      - name: Build YouPiP
        if: ${{ inputs.enable_youpip }}
        run: |
          cd YouPiP && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../youpip.deb

      - name: Build YTUHD
        if: ${{ inputs.enable_ytuhd }}
        run: |
          cd YTUHD && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ytuhd.deb

      - name: Build YouGroupSettings
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd }}
        run: |
          cd YouGroupSettings && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ygs.deb

      - name: Build YTVideoOverlay
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd }}
        run: |
          cd YTVideoOverlay && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ytvo.deb

      - name: Build YTPlaybackFix
        if: ${{ inputs.enable_ytpf }}
        run: |
          cd YTPlaybackFix && make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ../ytpf.deb

      - name: Build XS Runtime Lite
        run: |
          cd XSRuntimeLite
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ../xsruntimelite.deb

      - name: Verify XS v4.1 payload
        run: |
          echo "XS v4.1 payload:"
          ls -lh *.deb
          test -f ytplus.deb
          test -f xsruntimelite.deb

          if [ "${{ inputs.enable_youpip }}" = "true" ]; then
            test -f youpip.deb
            test -f ygs.deb
            test -f ytvo.deb
          fi

          if [ "${{ inputs.enable_ytuhd }}" = "true" ]; then
            test -f ytuhd.deb
            test -f ygs.deb
            test -f ytvo.deb
          fi

          if [ "${{ inputs.enable_ytpf }}" = "true" ]; then
            test -f ytpf.deb
          fi

      - name: Upload built debs
        uses: actions/upload-artifact@v7
        with:
          name: built-debs
          path: "*.deb"
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package XS v4.1.1 Final Ultra IPA
    runs-on: macos-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download built debs
        uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,enable_youpip,enable_ytuhd,enable_ytpf,trim_localizations,tweak_version

      - name: Download and validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Downloaded file is not a valid IPA. Detected: $file_type"
            exit 1
          fi

      - name: Clean Base - trim unused localizations
        if: ${{ inputs.trim_localizations }}
        run: |
          rm -rf clean-base
          mkdir clean-base
          unzip -q youtube.ipa -d clean-base

          app_path=$(find clean-base/Payload -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$app_path" ]; then
            echo "::error::Could not locate .app inside IPA"
            exit 1
          fi

          before=$(du -sk "$app_path" | awk '{print $1}')

          find "$app_path" -type d -name "*.lproj" \
            ! -name "Base.lproj" \
            ! -name "en.lproj" \
            ! -name "ko.lproj" \
            -prune -exec rm -rf {} +

          after=$(du -sk "$app_path" | awk '{print $1}')
          echo "Localization trim: ${before} KB -> ${after} KB"

          (
            cd clean-base
            zip -9qry ../youtube-clean.ipa Payload
          )
          mv youtube-clean.ipa youtube.ipa

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Build minimal tweak list
        run: |
          tweaks=(ytplus.deb xsruntimelite.deb)

          for f in youpip.deb ytuhd.deb ygs.deb ytvo.deb ytpf.deb; do
            if [ -f "$f" ]; then
              tweaks+=("$f")
            fi
          done

          printf '%s\n' "${tweaks[@]}" > xs-v4.1.1-tweaks.txt

          echo "Injecting only:"
          cat xs-v4.1.1-tweaks.txt

      - name: Inject XS v4.1.1 Final Ultra tweaks into IPA
        run: |
          tweaks=$(tr '\n' ' ' < xs-v4.1.1-tweaks.txt)

          cyan -i youtube.ipa \
            -o YouTubeXS-v4.1.1-FinalUltra_${{ inputs.tweak_version }}.ipa \
            -uwef $tweaks \
            -n "${{ inputs.display_name }}" \
            -b "${{ inputs.bundle_id }}"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: xs-v4-1-1-final-ultra-${{ github.run_number }}
          name: YouTube XS v4.1.1 Final Ultra ${{ inputs.tweak_version }} (${{ github.run_number }})
          files: YouTubeXS-v4.1.1-FinalUltra_${{ inputs.tweak_version }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::XS v4.1.1 Final Ultra release: https://github.com/${{ github.repository }}/releases"
