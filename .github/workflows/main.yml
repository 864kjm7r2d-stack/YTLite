name: Create YouTube Plus - iPhone XS Lite v3 MixFix

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Keep YouPiP / PiP for non-Premium"
        type: boolean
        required: true
        default: true

      enable_ytuhd:
        description: "Keep YTUHD / 4K support"
        type: boolean
        required: true
        default: true

      enable_ytpf:
        description: "YTPlaybackFix +0.25s (auto-retry Error 14)"
        type: boolean
        required: true
        default: true

      ipa_url:
        description: "URL to the decrypted YouTube IPA"
        default: ""
        required: true
        type: string

      tweak_version:
        description: "YTLite version (XS Lite target: 5.2b4)"
        default: "5.2b4"
        required: true
        type: string

      display_name:
        description: "App Name"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_ytpf: ${{ inputs.enable_ytpf }}
      tweak_version: ${{ inputs.tweak_version }}

  package:
    name: Package XS Lite v3 MixFix IPA
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write

    steps:
      - name: Download built debs
        uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,enable_youpip,enable_ytuhd,enable_ytpf,tweak_version

      - name: Download and validate IPA
        run: |
          wget "${{ github.event.inputs.ipa_url }}" --no-verbose -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Downloaded file is not a valid IPA. Detected: $file_type"
            exit 1
          fi

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Build minimal tweak list
        run: |
          tweaks=(ytplus.deb mixfix.deb)
          for f in youpip.deb ytuhd.deb ygs.deb ytvo.deb ytpf.deb; do
            if [ -f "$f" ]; then
              tweaks+=("$f")
            fi
          done
          printf '%s\n' "${tweaks[@]}" > xs-lite-v3-tweaks.txt
          echo "Injecting only:"
          cat xs-lite-v3-tweaks.txt
          if grep -Eqi 'YouQuality|yq\.deb|ryd\.deb|ytabc|demc' xs-lite-v3-tweaks.txt; then
            echo "::error::Non-Lite tweak detected"
            exit 1
          fi
          test -f mixfix.deb

      - name: Inject XS Lite v3 MixFix tweaks into IPA
        run: |
          tweaks=$(tr '\n' ' ' < xs-lite-v3-tweaks.txt)
          cyan -i youtube.ipa \
            -o YouTubeXS-Lite-v3-MixFix_${{ github.event.inputs.tweak_version }}.ipa \
            -uwef $tweaks \
            -n "${{ github.event.inputs.display_name }}" \
            -b "${{ github.event.inputs.bundle_id }}"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: xs-lite-v3-mixfix-${{ github.run_number }}
          name: YouTube XS Lite v3 MixFix ${{ github.event.inputs.tweak_version }} (${{ github.run_number }})
          files: YouTubeXS-Lite-v3-MixFix_${{ github.event.inputs.tweak_version }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::XS Lite v3 MixFix release: https://github.com/${{ github.repository }}/releases"
