name: Build Tweaks - XS Lite v3 MixFix

on:
  workflow_call:
    inputs:
      enable_youpip:
        type: boolean
        required: true
        default: true

      enable_ytuhd:
        type: boolean
        required: true
        default: true

      enable_ytpf:
        type: boolean
        required: true
        default: true

      tweak_version:
        type: string
        required: false
        default: "5.2b4"

jobs:
  build-tweaks:
    name: Build XS Lite v3 Tweaks
    runs-on: macos-latest

    steps:
      - name: Install Dependencies
        run: brew install make ldid dpkg

      - name: Set PATH environment variable
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5
        env:
          cache-name: theos_cache_9bc7340
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: ${{ steps.theos.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: ${{ steps.theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Download YTLite
        run: |
          deb_url="https://github.com/dayanch96/YTLite/releases/download/v${{ inputs.tweak_version }}/com.dvntm.ytlite_${{ inputs.tweak_version }}_iphoneos-arm.deb"
          wget "$deb_url" --no-verbose -O ytplus.deb
          file_type=$(file --mime-type -b ytplus.deb)
          if [[ "$file_type" != "application/vnd.debian.binary-package" ]]; then
            echo "::error::YTLite download is not a valid DEB. Detected: $file_type"
            exit 1
          fi

      - name: Clone YouTube headers
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd }}
        run: |
          if [ -d "$THEOS/include/YouTubeHeader" ]; then
            cd "$THEOS/include/YouTubeHeader" && git pull
          else
            cd "$THEOS/include" && git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git
          fi
          if [ -d "$THEOS/include/PSHeader" ]; then
            cd "$THEOS/include/PSHeader" && git pull
          else
            cd "$THEOS/include" && git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git
          fi

      - name: Clone YouPiP
        if: ${{ inputs.enable_youpip }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git

      - name: Clone YTUHD
        if: ${{ inputs.enable_ytuhd }}
        run: git clone --quiet --depth=1 https://github.com/Tonwalter888/YTUHD.git

      - name: Clone YouGroupSettings
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git

      - name: Clone YTVideoOverlay
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git

      - name: Clone YTPlaybackFix
        if: ${{ inputs.enable_ytpf }}
        run: git clone --quiet --depth=1 https://github.com/Mark02-2012/YTPlaybackFix.git

      - name: Patch YTPlaybackFix resume offset (+0.25s)
        if: ${{ inputs.enable_ytpf }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("YTPlaybackFix/Refresh.xm")
          s = p.read_text()
          old = "[pvc seekToTime:savedTime]"
          new = "[pvc seekToTime:(savedTime + 0.25)]"
          count = s.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 seek restore calls, found {count}; upstream YTPlaybackFix changed")
          p.write_text(s.replace(old, new))
          print("Patched both resume seeks to savedTime + 0.25s")
          PY

      - name: Create lightweight YTLite MixFix
        run: |
          mkdir -p YTLiteMixFix/layout/Library/MobileSubstrate/DynamicLibraries
          cat > YTLiteMixFix/Makefile <<'MAKEFILE'
          ARCHS = arm64
          TARGET = iphone:clang:16.5:15.0
          INSTALL_TARGET_PROCESSES = YouTube

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = YTLiteMixFix
          YTLiteMixFix_FILES = Tweak.xm
          YTLiteMixFix_CFLAGS = -fobjc-arc -O2
          YTLiteMixFix_FRAMEWORKS = Foundation

          include $(THEOS_MAKE_PATH)/tweak.mk
          MAKEFILE

          cat > YTLiteMixFix/control <<'CONTROL'
          Package: com.local.ytlitemixfix
          Name: YTLite MixFix
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Lightweight compatibility fix for YTLite Remove mixes on newer YouTube feed renderers.
          Maintainer: Local Build
          Author: Local Build
          Section: Tweaks
          Depends: mobilesubstrate
          CONTROL

          cat > YTLiteMixFix/YTLiteMixFix.plist <<'PLIST'
          { Filter = { Executables = ( "YouTube" ); }; }
          PLIST

          cat > YTLiteMixFix/Tweak.xm <<'TWEAK'
          #import <Foundation/Foundation.h>
          #import <objc/message.h>
          #import <objc/runtime.h>

          static BOOL YTLMixRemovalEnabled(void) {
              Class defaultsClass = NSClassFromString(@"YTLUserDefaults");
              if (!defaultsClass) return NO;

              SEL standardSel = NSSelectorFromString(@"standardUserDefaults");
              if (![defaultsClass respondsToSelector:standardSel]) return NO;

              id defaults = ((id (*)(id, SEL))objc_msgSend)((id)defaultsClass, standardSel);
              if (!defaults) return NO;

              SEL boolSel = NSSelectorFromString(@"boolForKey:");
              if (![defaults respondsToSelector:boolSel]) return NO;

              return ((BOOL (*)(id, SEL, id))objc_msgSend)(defaults, boolSel, @"hideMixPlaylists");
          }

          static BOOL YTLLooksLikeAutoMix(NSString *description) {
              if (description.length == 0) return NO;

              NSString *s = description.lowercaseString;

              // Known YTLite 5.2b4 marker plus newer radio URL marker.
              if ([s containsString:@"mix-watch"] || [s containsString:@"start_radio=1"]) {
                  return YES;
              }

              BOOL radioList = [s containsString:@"list=rd"] ||
                               [s containsString:@"list%3drd"] ||
                               [s containsString:@"playlistid=rd"] ||
                               [s containsString:@"playlistid: rd"];

              if (!radioList) return NO;

              // Keep this narrow so ordinary videos inside an opened mix are not globally hidden.
              return [s containsString:@"home_vertical_feed_prominence_group_key"] ||
                     [s containsString:@"playlist"] ||
                     [s containsString:@"radio"] ||
                     [s containsString:@"mix"] ||
                     [s containsString:@"lockup"];
          }

          %hook YTIElementRenderer
          - (NSData *)elementData {
              if (YTLMixRemovalEnabled() && YTLLooksLikeAutoMix([self description])) {
                  return nil;
              }
              return %orig;
          }
          %end
          TWEAK

      - name: Build YouPiP
        if: ${{ inputs.enable_youpip }}
        run: |
          cd YouPiP && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../youpip.deb

      - name: Build YTUHD
        if: ${{ inputs.enable_ytuhd }}
        run: |
          cd YTUHD && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ytuhd.deb

      - name: Build YouGroupSettings
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd }}
        run: |
          cd YouGroupSettings && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ygs.deb

      - name: Build YTVideoOverlay
        if: ${{ inputs.enable_youpip || inputs.enable_ytuhd }}
        run: |
          cd YTVideoOverlay && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ytvo.deb

      - name: Build YTPlaybackFix
        if: ${{ inputs.enable_ytpf }}
        run: |
          cd YTPlaybackFix && make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ../ytpf.deb

      - name: Build MixFix
        run: |
          cd YTLiteMixFix
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ../mixfix.deb

      - name: Verify XS Lite v3 payload
        run: |
          echo "XS Lite v3 payload:"
          ls -lh *.deb
          test -f ytplus.deb
          test -f mixfix.deb
          if [ "${{ inputs.enable_youpip }}" = "true" ]; then
            test -f youpip.deb
            test -f ygs.deb
            test -f ytvo.deb
          fi
          if [ "${{ inputs.enable_ytuhd }}" = "true" ]; then
            test -f ytuhd.deb
            test -f ygs.deb
            test -f ytvo.deb
          fi
          if [ "${{ inputs.enable_ytpf }}" = "true" ]; then
            test -f ytpf.deb
          fi
          for forbidden in yq.deb ryd.deb ytabc.deb demc.deb; do
            if [ -f "$forbidden" ]; then
              echo "::error::Forbidden tweak unexpectedly exists: $forbidden"
              exit 1
            fi
          done

      - name: Upload built debs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: built-debs
          path: "*.deb"
          if-no-files-found: error
          retention-days: 1
